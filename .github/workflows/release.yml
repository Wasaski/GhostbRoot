# GhostbRoot — signed release on version tag (spec §6)
# Trigger: git tag v1.0.0 -> builds, signs, checksums and publishes to a GitHub Release.
# Signing requires repository secrets; if absent the job FAILS instead of
# publishing an unsigned APK as trusted (spec: never publish unsigned release).
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify signing secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$KEYSTORE_BASE64" ] && MISSING="$MISSING ANDROID_KEYSTORE_BASE64" || true
          [ -z "$KEYSTORE_PASSWORD" ] && MISSING="$MISSING KEYSTORE_PASSWORD" || true
          [ -z "$KEY_ALIAS" ] && MISSING="$MISSING KEY_ALIAS" || true
          [ -z "$KEY_PASSWORD" ] && MISSING="$MISSING KEY_PASSWORD" || true
          if [ -n "$MISSING" ]; then
            echo "::error::Missing signing secrets:$MISSING — refusing to publish an unsigned APK."
            exit 1
          fi
          echo "All signing secrets present."

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "KEYSTORE_PATH=$PWD/release.keystore" >> "$GITHUB_ENV"

      - name: Build Debug APK (kept for testing)
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
        # Signing is configured in app/build.gradle.kts via env vars
        # (KEYSTORE_PATH / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD).

      - name: Verify integrity (apksigner verify where available)
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            apksigner verify --verbose "$apk" || { echo "::error::APK failed signature verification: $apk"; exit 1; }
          done
          echo "All release APKs passed apksigner verification."

      - name: Generate SHA256 checksums
        run: |
          cd app/build/outputs/apk
          sha256sum debug/*.apk release/*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Clean keystore
        if: always()
        run: rm -f release.keystore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: GhostbRoot ${{ steps.tag.outputs.tag }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/SHA256SUMS.txt
          fail_on_unmatched_files: true
