[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostbroot"
version = "1.0.0"
description = "GhostbRoot Python SDK — control overlay panels from Termux"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "GhostbRoot" }]
keywords = ["android", "termux", "overlay", "ghostbroot"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
